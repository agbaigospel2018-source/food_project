                Vendor Header
=========================================== -->

<section class="relative overflow-hidden bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500">

    <div class="absolute inset-0 bg-black/10"></div>

    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-16">

        <div class="max-w-3xl">

            <span class="inline-flex items-center px-3 sm:px-4 py-1 sm:py-2 rounded-full bg-white/20 text-white text-xs sm:text-sm font-medium mb-4 sm:mb-5">

                <i data-lucide="utensils" class="w-5 h-5 inline text-orange-500 mr-1"></i> Belleful Express

            </span>

            <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-white leading-tight">

                {{ page_title|default:"Good Food, No Waiting." }}

            </h1>

            <p class="mt-4 sm:mt-5 text-sm sm:text-lg text-orange-100">

                {{ page_subtitle|default:"Order ahead from your favorite campus restaurants and skip the queue." }}

            </p>

        </div>

    </div>

</section>
