<!-- ==========================================
                Vendor Search
=========================================== -->

<form method="GET" class="mb-8">

    <div class="flex flex-col lg:flex-row gap-4">

        <!-- Search Input -->

        <div class="relative flex-1">

            <div class="absolute inset-y-0 left-0 flex items-center pl-4">

                <svg
                    class="w-5 h-5 text-gray-400"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24">

                    <circle cx="11" cy="11" r="8"></circle>

                    <path d="M21 21l-4.35-4.35"></path>

                </svg>

            </div>

            <input
                type="text"
                name="q"
                value="{{ request.GET.q }}"
                placeholder="Search restaurants, locations..."
                class="w-full pl-12 pr-4 py-4 rounded-2xl border border-gray-300 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">

        </div>

        <!-- Search Button -->

        <button
            type="submit"
            class="px-8 py-4 bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-semibold transition shadow">

            Search

        </button>

    </div>

</form>
