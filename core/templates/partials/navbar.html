{% load static %}

<!-- ===========================
    Desktop Navigation
=========================== -->

<header class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[95%] max-w-7xl rounded-2xl bg-orange-600/95 backdrop-blur shadow-xl hidden md:block">

    <div class="mx-auto px-6">

        <div class="flex items-center justify-between h-16">

            <!-- Logo -->

            <a href="{% url 'home' %}"
               class="text-2xl font-bold text-white tracking-wide">

                Belleful Express

            </a>

            <!-- Navigation -->

            <nav class="flex items-center gap-8">

                <a href="{% url 'home' %}"
                   class="{% if request.resolver_match.url_name == 'home' %}text-yellow-300{% else %}text-white hover:text-yellow-200{% endif %} font-medium transition">

                    Home

                </a>

                <a href="{% url 'vendor_dashboard' %}"
                   class="{% if request.resolver_match.url_name == 'vendor_dashboard' %}text-yellow-300{% else %}text-white hover:text-yellow-200{% endif %} font-medium transition">

                    Restaurants

                </a>

                <a href="{% url 'menu:item_list' %}"
                   class="{% if request.resolver_match.url_name == 'item_list' %}text-yellow-300{% else %}text-white hover:text-yellow-200{% endif %} font-medium transition">

                    Menu

                </a>

                <a href="{% url 'about' %}"
                   class="{% if request.resolver_match.url_name == 'about' %}text-yellow-300{% else %}text-white hover:text-yellow-200{% endif %} font-medium transition">

                    About

                </a>

                <a href="{% url 'contact' %}"
                   class="{% if request.resolver_match.url_name == 'contact' %}text-yellow-300{% else %}text-white hover:text-yellow-200{% endif %} font-medium transition">

                    Contact

                </a>

            </nav>

            <!-- Right Side -->

            <div class="flex items-center gap-4">

                {% if user.is_authenticated %}

                <a href="{% url 'cart:cart_detail' %}"
                   class="relative text-white hover:text-yellow-200">

                    <!-- Cart Icon -->
                    <svg class="w-6 h-6"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">

                        <circle cx="9" cy="21" r="1"></circle>

                        <circle cx="20" cy="21" r="1"></circle>

                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.96-1.61L23 6H6"></path>

                    </svg>

                    {% if cart_count %}

                    <span class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-red-500 text-xs flex items-center justify-center">

                        {{ cart_count }}

                    </span>

                    {% endif %}

                </a>

                <a href="{% url 'orders:order_history' %}"
                   class="text-white hover:text-yellow-200">

                    Orders

                </a>

                <a href="{% url 'profile' %}"
                   class="text-white hover:text-yellow-200">

                    Profile

                </a>

                <a href="{% url 'logout' %}"
                   class="bg-white text-orange-600 px-4 py-2 rounded-lg font-semibold hover:bg-orange-100">

                    Logout

                </a>

                {% else %}

                <a href="{% url 'login' %}"
                   class="text-white hover:text-yellow-200">

                    Login

                </a>

                <a href="{% url 'register' %}"
                   class="bg-white text-orange-600 px-4 py-2 rounded-lg font-semibold hover:bg-orange-100">

                    Register

                </a>

                {% endif %}

            </div>

        </div>

    </div>

</header>



<!-- ===================================
        MOBILE BOTTOM NAVIGATION
=================================== -->

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-2xl md:hidden z-50">

    <div class="grid grid-cols-5 h-16">

        <!-- HOME -->

        <a href="{% url 'home' %}"
           class="flex flex-col items-center justify-center gap-1
           {% if request.resolver_match.url_name == 'home' %}
           text-orange-600
           {% else %}
           text-gray-500
           {% endif %}">

            <svg class="w-6 h-6"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">

                <path d="M3 10l9-7 9 7"></path>

                <path d="M9 22V12h6v10"></path>

            </svg>

            <span class="text-xs">Home</span>

        </a>

        <!-- RESTAURANTS -->

        <a href="{% url 'menu:item_list' %}"
           class="flex flex-col items-center justify-center gap-1
           {% if request.resolver_match.url_name == 'item_list' %}
           text-orange-600
           {% else %}
           text-gray-500
           {% endif %}">

            <svg class="w-6 h-6"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">

                <path d="M8 3v8"></path>

                <path d="M12 3v8"></path>

                <path d="M10 11v10"></path>

                <path d="M17 3v18"></path>

            </svg>

            <span class="text-xs">Food</span>

        </a>

        <!-- CART -->

        <a href="{% url 'cart:cart_detail' %}"
           class="relative flex flex-col items-center justify-center gap-1
           {% if request.resolver_match.namespace == 'cart' %}
           text-orange-600
           {% else %}
           text-gray-500
           {% endif %}">

            <svg class="w-6 h-6"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">

                <circle cx="9" cy="21" r="1"></circle>

                <circle cx="20" cy="21" r="1"></circle>

                <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.96-1.61L23 6H6"></path>

            </svg>

            {% if cart_count %}

            <span class="absolute top-1 right-4 bg-red-500 text-white text-[10px] rounded-full h-5 w-5 flex items-center justify-center">

                {{ cart_count }}

            </span>

            {% endif %}

            <span class="text-xs">Cart</span>

        </a>

        <!-- ORDERS -->

        <a href="{% url 'orders:order_history' %}"
           class="flex flex-col items-center justify-center gap-1
           {% if request.resolver_match.namespace == 'orders' %}
           text-orange-600
           {% else %}
           text-gray-500
           {% endif %}">

            <svg class="w-6 h-6"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">

                <path d="M9 12l2 2 4-4"></path>

                <path d="M21 12A9 9 0 1112 3"></path>

            </svg>

            <span class="text-xs">Orders</span>

        </a>

        <!-- PROFILE -->

        <a href="{% url 'profile' %}"
           class="flex flex-col items-center justify-center gap-1
           {% if request.resolver_match.url_name == 'profile' %}
           text-orange-600
           {% else %}
           text-gray-500
           {% endif %}">

            <svg class="w-6 h-6"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">

                <path d="M20 21a8 8 0 00-16 0"></path>

                <circle cx="12" cy="7" r="4"></circle>

            </svg>

            <span class="text-xs">Profile</span>

        </a>

    </div>

</nav>
