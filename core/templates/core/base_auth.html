{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}Authentication | Belleful Express{% endblock %}
    </title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    
    {% tailwind_css %}
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 flex flex-col min-h-screen">
    
    <!-- Toast Messages Container -->
    <div id="toast-container" class="fixed top-8 right-4 z-50 flex flex-col gap-3 pointer-events-none">
        {% if messages %}
            {% for message in messages %}
                <div class="toast-message transform transition-all duration-300 translate-x-full opacity-0 px-6 py-4 rounded-xl shadow-lg border-l-4 text-white pointer-events-auto flex items-center justify-between gap-4
                    {% if message.tags == 'error' %}bg-red-500 border-red-700
                    {% elif message.tags == 'success' %}bg-green-500 border-green-700
                    {% elif message.tags == 'warning' %}bg-yellow-500 border-yellow-700
                    {% else %}bg-blue-500 border-blue-700{% endif %}"
                    role="alert">
                    <p class="font-medium">{{ message }}</p>
                    <button onclick="this.closest('.toast-message').remove()" class="text-white hover:text-gray-200 focus:outline-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            {% endfor %}
        {% endif %}
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const toasts = document.querySelectorAll('.toast-message');
            toasts.forEach((toast, index) => {
                setTimeout(() => {
                    toast.classList.remove('translate-x-full', 'opacity-0');
                }, 100 * index);
                
                setTimeout(() => {
                    toast.classList.add('translate-x-full', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 5000 + (100 * index));
            });
        });
    </script>
    
    <main class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
