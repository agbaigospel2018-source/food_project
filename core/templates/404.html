{% extends 'core/base.html' %}

{% block title %}
    Page Not Found | Belleful Express
{% endblock %}

{% block content %}

<section class="flex items-center justify-center min-h-[70vh] px-6">

    <div class="text-center max-w-2xl">

        <h1 class="text-8xl md:text-9xl font-extrabold text-orange-600">
            404
        </h1>

        <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mt-4">
            Oops! Page Not Found
        </h2>

        <p class="text-gray-600 mt-6 text-lg">
            The page you are looking for doesn't exist,
            may have been moved, or the URL might be incorrect.
        </p>

        <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">

            <a href="{% url 'home' %}"
               class="bg-orange-600 hover:bg-orange-700 text-white px-8 py-3 rounded-xl font-semibold transition">

                Back Home

            </a>

            <button onclick="history.back()"
                    class="border border-orange-600 text-orange-600 hover:bg-orange-50 px-8 py-3 rounded-xl font-semibold transition">

                Go Back

            </button>

        </div>

        <div class="mt-12">

            <svg class="w-40 h-40 mx-auto text-orange-200"
                 fill="currentColor"
                 viewBox="0 0 24 24">

                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>

            </svg>

        </div>

    </div>

</section>

{% endblock %}
